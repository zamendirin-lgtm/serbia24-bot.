name: Serbia24 Afisha small cultural sources smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afisha-local-culture-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_afisha*.py' -v
      - name: Check current small-venue event listings without publication
        run: PYTHONPATH=. python scripts/afisha_local_culture_smoke.py

