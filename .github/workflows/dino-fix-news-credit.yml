name: DinoDvij - fix existing photo credit
on:
  push:
    paths:
      - 'dino/.fix-news-credit-once'
permissions:
  contents: write
concurrency:
  group: dinodvij-publisher
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DINO_BOT_TOKEN: ${{ secrets.DINO_BOT_TOKEN }}
      DINO_CHAT_ID: '-1002244148588'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r dino/requirements.txt
      - name: Prepare full attribution, without Telegram changes
        run: python dino/fix_news_credit_once.py --prepare
      - name: Publish the credits page before linking it
        run: |
          git add dino/credits/news-156631916.md
          if ! git diff --cached --quiet; then
            git config user.name 'dinodvij-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(dino): attribute November therian photo [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Edit existing post 741553 without replacing photograph
        run: python dino/fix_news_credit_once.py --edit