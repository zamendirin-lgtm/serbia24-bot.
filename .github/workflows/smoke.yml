name: Serbia24 live RSS smoke test
on:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'requirements.txt'
      - 'scripts/smoke.py'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check live news retrieval and free translation
        env:
          PYTHONPATH: .
          DRY_RUN: '1'
        run: python scripts/smoke.py
