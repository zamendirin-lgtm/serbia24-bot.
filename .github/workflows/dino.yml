name: DinoDvij — themed news and videos

on:
  push:
    paths:
      - 'dino/.run-once'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview candidates without sending Telegram messages"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dinodvij-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DINO_BOT_TOKEN: ${{ secrets.DINO_BOT_TOKEN }}
      DINO_CHAT_ID: ${{ secrets.DINO_CHAT_ID }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      DINO_MAX_DAILY: "50"
      DINO_TIMEZONE: "Europe/Belgrade"
      DINO_VERIFY_ONLY: ${{ github.event_name == 'push' && 'true' || 'false' }}
      DINO_DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone DinoDvij dependencies
        run: python -m pip install -r dino/requirements.txt
      - name: Find and post one eligible item
        run: python dino/bot.py
      - name: Save state only when changed
        if: ${{ env.DINO_DRY_RUN != 'true' }}
        run: |
          git add dino/state.json
          if ! git diff --cached --quiet; then
            git config user.name "dinodvij-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(dino): remember posted items [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
