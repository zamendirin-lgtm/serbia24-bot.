name: Belgrade Afisha source check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/afisha-belgrade-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/afisha_belgrade_probe.py
