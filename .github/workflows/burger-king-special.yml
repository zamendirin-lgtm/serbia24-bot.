name: Serbia24 - one-time Burger King menu prices

on:
  push:
    paths:
      - '.github/workflows/burger-king-special.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serbia24-news
  cancel-in-progress: false

jobs:
  post-burger-king:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout latest source and history
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run news bot tests
        run: python -m unittest discover -s tests -q
      - name: Publish verified Burger King prices (once)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@serbia24live'
        run: python -m scripts.publish_burger_king_20261112
      - name: Persist publication history
        run: python scripts/persist_history.py
