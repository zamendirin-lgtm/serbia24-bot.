name: DinoDvij - remove obsolete bot commands announcement
on:
  push:
    paths:
      - 'dino/.delete-announcement-once'
permissions:
  contents: write
concurrency:
  group: dinodvij-replies
  cancel-in-progress: false
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DINO_BOT_TOKEN: ${{ secrets.DINO_BOT_TOKEN }}
      DINO_CHAT_ID: "-1002244148588"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r dino/requirements.txt
      - run: python dino/chat_remove_announcement.py
      - name: Remember deletion
        run: |
          git add dino/chat_state.json
          if ! git diff --cached --quiet; then
            git config user.name "dinodvij-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(dino): mark announcement removed [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
