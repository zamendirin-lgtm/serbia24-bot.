name: Serbia24 automatic news

on:
  schedule:
    - cron: '7,22,37,52 6-21 * * *' # every 15 min UTC; bot enforces 08:00-22:00 Belgrade DST-safe
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news.yml' # verify 10/day and 90-minute posting interval without publishing during night hours

permissions:
  contents: write

concurrency:
  group: serbia24-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Telegram credentials
        id: credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bot token is missing. Add TELEGRAM_BOT_TOKEN under Settings > Secrets and variables > Actions. Nothing will be posted."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bot token is configured. Testing channel permissions and fetching news."
          fi
      - name: Validate channel logo fallback (no posting)
        if: steps.credentials.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@serbia24live'
        run: |
          python - <<'PY'
          from io import BytesIO
          import os
          from unittest.mock import patch
          from PIL import Image
          import bot
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          channel = os.environ["TELEGRAM_CHANNEL"]
          avatar = bot._telegram_channel_avatar(token, channel)
          with patch.object(bot, "_telegram_channel_avatar", return_value=avatar):
              result = bot.branded_fallback_photo(token, channel)
          with Image.open(BytesIO(result)) as picture:
              assert picture.size == (1200, 675)
              assert picture.format == "JPEG"
          print("Fallback branded JPEG: OK; Telegram channel avatar available:", bool(avatar))
          PY
      - name: Find, translate, publish
        if: steps.credentials.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@serbia24live'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          EDITOR_REVIEW_ENABLED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EDITOR_MODEL: 'gemini-3.5-flash-lite'
          DAILY_LIMIT: '10'
          PER_RUN_LIMIT: '1'
        run: python bot.py
      - name: Persist published article history safely
        if: steps.credentials.outputs.ready == 'true'
        run: python scripts/persist_history.py

      # Only a short daytime fallback check; this does not change the news bot.
      - name: Afisha fallback check on reliable news schedule
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
          AFISHA_CHAT_ID: '@Serbia24Afisha'
          AFISHA_ENABLE_TONS: '1'
          AFISHA_ENABLE_BELGRADE: '1'
          AFISHA_ENABLE_SUBOTICA: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EDITOR_MODEL: 'gemini-3.5-flash-lite'
        run: python scripts/afisha_backup.py


  # Independent science-channel job on an already verified, reliably triggered
  # Serbia24 workflow schedule. Does not interact with the news publishing job.
  reality_science:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: reality-publisher
      cancel-in-progress: false
    env:
      REALITY_BOT_TOKEN: ${{ secrets.REALITY_BOT_TOKEN }}
      REALITY_CHAT_ID: '@priroda_realnosti'
      REALITY_DRY_RUN: 'false'
    steps:
      - name: Checkout for independent Reality bot
        uses: actions/checkout@v4
      - name: Python for science sources
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science RSS dependencies
        run: python -m pip install -r reality/requirements.txt
      - name: Verify science channel token and permissions
        run: python reality/verify.py
      - name: Post one verified science item if permitted
        run: |
          python -m py_compile reality/bot.py
          python reality/bot.py
      - name: Save Reality posting history
        run: |
          git add reality/state.json
          if ! git diff --cached --quiet; then
            git config user.name "reality-publisher[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(reality): remember scheduled science item [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
