name: Serbia24 automatic news

on:
  schedule:
    - cron: '17,47 * * * *' # every ~30 min (UTC); runs can be delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serbia24-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Find, translate, publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          DAILY_LIMIT: '10'
          PER_RUN_LIMIT: '2'
        run: python bot.py
      - name: Persist published article history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record published headlines'
            git push
          fi
