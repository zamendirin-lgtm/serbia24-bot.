name: Serbia24 automatic news

on:
  schedule:
    - cron: '17,47 6-20 * * *' # UTC; actual 08:00-22:00 Europe/Belgrade enforced by bot
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news.yml' # verifies editorial gate and channel publishing on workflow changes

permissions:
  contents: write

concurrency:
  group: serbia24-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Telegram credentials
        id: credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bot token is missing. Add TELEGRAM_BOT_TOKEN under Settings > Secrets and variables > Actions. Nothing will be posted."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bot token is configured. Testing channel permissions and fetching news."
          fi
      - name: Validate channel logo fallback (no posting)
        if: steps.credentials.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@serbia24live'
        run: |
          python - <<'PY'
          from io import BytesIO
          import os
          from unittest.mock import patch
          from PIL import Image
          import bot
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          channel = os.environ["TELEGRAM_CHANNEL"]
          avatar = bot._telegram_channel_avatar(token, channel)
          with patch.object(bot, "_telegram_channel_avatar", return_value=avatar):
              result = bot.branded_fallback_photo(token, channel)
          with Image.open(BytesIO(result)) as picture:
              assert picture.size == (1200, 675)
              assert picture.format == "JPEG"
          print("Fallback branded JPEG: OK; Telegram channel avatar available:", bool(avatar))
          PY
      - name: Find, translate, publish
        if: steps.credentials.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@serbia24live'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITOR_MODEL: 'gemini-2.5-flash-lite'
          DAILY_LIMIT: '40'
          PER_RUN_LIMIT: '2'
        run: python bot.py
      - name: Persist published article history safely
        if: steps.credentials.outputs.ready == 'true'
        run: python scripts/persist_history.py
