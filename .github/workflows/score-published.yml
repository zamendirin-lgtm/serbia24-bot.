name: Serbia24 historical editorial quality audit

on:
  push:
    paths:
      - '.github/workflows/score-published.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serbia24-historical-quality
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install requests
      - name: Review every publicly retrievable news post using Groq (no Telegram posts)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/score_published.py
      - name: Save historical editorial report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/serbia24_editorial_audit.json reports/serbia24_editorial_audit.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: audit readability of accessible historical Serbia24 posts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
