name: Afisha source structure targeted
on:
  push:
    branches: [main]
    paths: ['.github/workflows/afisha-source-inspect.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/afisha_source_inspect.py
