name: Serbia24 Afisha — first authorized test post

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afisha-first-post.yml'

permissions:
  contents: write

concurrency:
  group: serbia24-afisha
  cancel-in-progress: false

jobs:
  first-test-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check quiet-hours and editorial safeguards
        run: python -m unittest discover -s tests -p 'test_afisha*.py' -v
      - name: Verify existing bot can post to Afisha (without publishing)
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
          AFISHA_CHAT_ID: '@Serbia24Afisha'
        run: python scripts/check_afisha_telegram.py
      - name: Publish exactly one AI-selected, source-linked first Afisha post
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
          AFISHA_CHAT_ID: '@Serbia24Afisha'
          AFISHA_FIRST_POST_ONCE: '1'
          AFISHA_ENABLE_TONS: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EDITOR_MODEL: 'gemini-3.5-flash-lite'
        run: python afisha_bot.py
      - name: Save first-post history and avoid future duplicates
        run: python scripts/persist_afisha.py
