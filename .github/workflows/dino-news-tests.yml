name: DinoDvij - sourced news smoke test
on:
  push:
    paths:
      - 'dino/.news-test-once'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r dino/requirements.txt
      - run: python -m compileall -q dino/bot.py dino/news_auto.py dino/video_only.py
      - run: python dino/test_news.py
