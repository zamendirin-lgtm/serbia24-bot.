name: Reality — one-time owner-approved publication via issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: reality-publisher
  cancel-in-progress: false

jobs:
  publish_on_request:
    if: github.event.issue.user.login == 'zamendirin-lgtm' && github.event.issue.title == '[reality] publish Mars article now'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      REALITY_BOT_TOKEN: ${{ secrets.REALITY_BOT_TOKEN }}
      REALITY_CHAT_ID: '@priroda_realnosti'
      REALITY_DRY_RUN: 'false'
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r reality/requirements.txt
      - name: Validate new token and channel admin rights
        run: python reality/verify.py
      - name: Publish the one verified Mars science article
        run: python reality/publish_now.py
      - name: Persist published-item history
        run: |
          git add reality/state.json
          if ! git diff --cached --quiet; then
            git config user.name "reality-publisher[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(reality): remember manual science article [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Write a visible result on the trigger issue
        if: always()
        env:
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Reality publication result: **$RESULT**. [Workflow log]($RUN_URL). A success means the Telegram API acknowledged posting. Failures need attention in the workflow log."
