name: Serbia24 Afisha events

on:
  schedule:
    - cron: '17 7,9,11,14,17,19 * * *' # 08/10/12/15/18/20 winter; 09/11/13/16/19/21 summer
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/afisha.yml' # credentials and deployment smoke when adapter changes

permissions:
  contents: write

concurrency:
  group: serbia24-afisha
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Afisha unit tests
        run: python -m unittest discover -s tests -p 'test_afisha*.py' -v
      # Verified Telegram @Serbia24Afisha with the existing bot; reuse it as safe default.
      - name: Check Telegram destination
        id: dest
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
          AFISHA_CHAT_ID: ${{ vars.AFISHA_CHAT_ID || secrets.AFISHA_CHAT_ID || vars.PROPERTY_CHAT_ID || secrets.PROPERTY_CHAT_ID || '@Serbia24Afisha' }}
        run: |
          if [ -n "$AFISHA_BOT_TOKEN" ] && [ -n "$AFISHA_CHAT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Afisha destination missing. Reusing PROPERTY_BOT_TOKEN / PROPERTY_CHAT_ID is supported. To finish, add AFISHA_CHAT_ID (or PROPERTY_CHAT_ID) as an Actions variable.'
          fi
      # Safe verification run after reconnecting existing real-estate Telegram credentials.
      - name: Discover Afisha channel from existing Telegram bot (no posting)
        if: steps.dest.outputs.ready == 'false'
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
        run: python scripts/discover_afisha_destination.py
      - name: Verify existing Telegram bot and Afisha channel (no posting)
        if: steps.dest.outputs.ready == 'true'
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
          AFISHA_CHAT_ID: ${{ vars.AFISHA_CHAT_ID || secrets.AFISHA_CHAT_ID || vars.PROPERTY_CHAT_ID || secrets.PROPERTY_CHAT_ID || '@Serbia24Afisha' }}
        run: python scripts/check_afisha_telegram.py
      # A commit marked [afisha-publish] explicitly authorizes one catch-up post.
      # Normal code/configuration pushes remain read-only, to avoid noise.
      - name: Discover and publish selected events
        if: steps.dest.outputs.ready == 'true' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[afisha-publish]'))
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
          AFISHA_CHAT_ID: ${{ vars.AFISHA_CHAT_ID || secrets.AFISHA_CHAT_ID || vars.PROPERTY_CHAT_ID || secrets.PROPERTY_CHAT_ID || '@Serbia24Afisha' }}
          AFISHA_ENABLE_TONS: '1'
          AFISHA_ENABLE_BELGRADE: '1'
          AFISHA_ENABLE_SUBOTICA: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EDITOR_MODEL: 'gemini-3.5-flash-lite'
        run: python afisha_bot.py
      - name: Safely persist Afisha history
        if: steps.dest.outputs.ready == 'true' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[afisha-publish]'))
        run: python scripts/persist_afisha.py
