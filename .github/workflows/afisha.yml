name: Serbia24 Afisha events

on:
  schedule:
    - cron: '17 7,11,15,19 * * *' # 08/12/16/20 winter Belgrade; 09/13/17/21 summer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serbia24-afisha
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Afisha tests
        run: python -m unittest discover -s tests -p 'test_afisha_bot.py' -v
      - name: Check Telegram destination
        id: dest
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN }}
          AFISHA_CHAT_ID: ${{ vars.AFISHA_CHAT_ID }}
        run: |
          if [ -n "$AFISHA_BOT_TOKEN" ] && [ -n "$AFISHA_CHAT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Afisha is not connected yet. Add AFISHA_BOT_TOKEN secret and AFISHA_CHAT_ID variable.'
          fi
      - name: Discover and publish selected events
        if: steps.dest.outputs.ready == 'true'
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN }}
          AFISHA_CHAT_ID: ${{ vars.AFISHA_CHAT_ID }}
          AFISHA_ENABLE_TONS: '1'
        run: python afisha_bot.py
      - name: Safely persist Afisha history
        if: steps.dest.outputs.ready == 'true'
        run: python scripts/persist_afisha.py
