name: DinoDvij - edit verbose published news caption
on:
  push:
    paths:
      - 'dino/.edit-news-caption-once'
permissions:
  contents: read
concurrency:
  group: dinodvij-publisher
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DINO_BOT_TOKEN: ${{ secrets.DINO_BOT_TOKEN }}
      DINO_CHAT_ID: "-1002244148588"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r dino/requirements.txt
      - run: python dino/edit_news_caption_once.py
