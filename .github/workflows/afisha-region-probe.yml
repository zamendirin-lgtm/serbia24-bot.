name: Afisha Serbia regional sources smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afisha-region-probe.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/afisha_region_probe.py
