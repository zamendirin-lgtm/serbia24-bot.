name: Serbia24 Afisha — corrected photo test (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afisha-corrected-photo.yml'

permissions:
  contents: write

concurrency:
  group: serbia24-afisha
  cancel-in-progress: false

jobs:
  corrected-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test clean Russian Afisha format and strict quiet hours
        run: python -m unittest discover -s tests -p 'test_afisha*.py' -v
      - name: Confirm bot is an administrator of the actual Afisha channel
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
          AFISHA_CHAT_ID: '@Serbia24Afisha'
        run: python scripts/check_afisha_telegram.py
      - name: Send corrected promotional photo with Russian-only caption once
        env:
          AFISHA_BOT_TOKEN: ${{ secrets.AFISHA_BOT_TOKEN || secrets.PROPERTY_BOT_TOKEN }}
        run: PYTHONPATH=. python scripts/afisha_corrected_photo_once.py
      - name: Save correction history and prevent duplicates
        run: python scripts/persist_afisha.py
