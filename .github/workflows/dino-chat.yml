name: DinoDvij — replies in group
on:
  push:
    paths:
      - 'dino/.chat-check-once'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read recent updates but do not reply to anyone"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: dinodvij-replies
  cancel-in-progress: false
jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DINO_BOT_TOKEN: ${{ secrets.DINO_BOT_TOKEN }}
      DINO_CHAT_ID: "-1002244148588"
      DINO_CHAT_DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight Telegram dependencies
        run: python -m pip install -r dino/requirements.txt
      - name: Reply to mentions and stop targeted abuse
        run: python dino/chat_replies.py
      - name: Remember the update offset (no message data)
        if: ${{ env.DINO_CHAT_DRY_RUN != 'true' }}
        run: |
          git add dino/chat_state.json
          if ! git diff --cached --quiet; then
            git config user.name "dinodvij-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(dino): remember chat polling offset [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
