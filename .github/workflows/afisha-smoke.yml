name: Serbia24 Afisha live source smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afisha-smoke.yml'
      - 'scripts/afisha_source_check.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Discover official events without posting or Telegram credentials
        run: PYTHONPATH=. python scripts/afisha_source_check.py
