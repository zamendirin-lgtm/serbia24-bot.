name: Serbia24 Afisha AI editor live test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afisha-ai-smoke.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test AI editorial quality on live events (NO TELEGRAM POST)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EDITOR_MODEL: 'gemini-3.5-flash-lite'
        run: PYTHONPATH=. python scripts/afisha_editor_smoke.py
