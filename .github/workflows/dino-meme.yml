name: DinoDvij - publish new youth meme
on:
  push:
    paths:
      - 'dino/.meme-once'
permissions:
  contents: write
concurrency:
  group: dinodvij-publisher
  cancel-in-progress: false
jobs:
  meme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DINO_BOT_TOKEN: ${{ secrets.DINO_BOT_TOKEN }}
      DINO_CHAT_ID: "-1002244148588"
      DINO_TIMEZONE: "Europe/Belgrade"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r dino/requirements.txt
      - name: Publish original meme card to Telegram
        run: python dino/meme_once.py
      - name: Save sent meme ID to history
        run: |
          git add dino/state.json
          if ! git diff --cached --quiet; then
            git config user.name "dinodvij-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(dino): save meme history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
