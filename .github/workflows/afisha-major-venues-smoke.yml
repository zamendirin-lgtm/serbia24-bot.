name: Serbia24 Afisha major venues live verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afisha-major-venues-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_afisha*.py'
      - name: Check live official venue calendars (no Telegram publication)
        run: PYTHONPATH=. python scripts/afisha_major_venues_smoke.py
