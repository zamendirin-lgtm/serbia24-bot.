name: DinoDvij - chat safety tests
on:
  push:
    paths:
      - 'dino/.test-chat-once'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r dino/requirements.txt
      - run: python -m compileall -q dino/chat_replies.py dino/bot.py dino/memes.py dino/learn_style.py dino/offline_brain.py
      - run: python dino/test_chat.py
      - run: python dino/test_brain.py
